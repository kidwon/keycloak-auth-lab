token.unavailable=利用できません。もう一度ログインしてください。
token.storage=トークンはサーバーのメモリーに保存され、ページに生のトークンは渡されません。
token.refreshed=サーバー側の refresh_token grant により Access Token を自動更新しました。
token.current=今回は更新不要です。有効期限の60秒前以降に再度アクセスすると自動更新されます。
token.failed=トークンを利用できないか、更新に失敗しました。ログアウトしてから再ログインしてください。
api.denied=401：トークンが無効です。403：ロール、scope、または所有権が不足しています。404：注文が存在しません。
api.failed=呼び出しに失敗しました
api.unavailable=サービスの稼働状態を確認してください。更新に失敗した場合は再ログインしてください。エラー応答や認証情報は表示しません。
