services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U keycloak -d keycloak]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HEALTH_ENABLED: 'true'
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET:?required}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET:?required}
      ALICE_PASSWORD: ${ALICE_PASSWORD:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-8080}
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8081}:8080'
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/auth-lab-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  resource-api:
    build:
      context: .
      args:
        MODULE: resource-api
    environment:
      ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8081}/realms/auth-lab
      JWK_SET_URI: http://keycloak:8080/realms/auth-lab/protocol/openid-connect/certs
    ports:
      - '127.0.0.1:${API_PORT:-8082}:8082'
    depends_on:
      keycloak:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8082; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web-client:
    build:
      context: .
      args:
        MODULE: web-client
    environment:
      ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8081}/realms/auth-lab
      KEYCLOAK_BACKCHANNEL: http://keycloak:8080/realms/auth-lab
      WEB_ORIGIN: http://localhost:${WEB_PORT:-8080}
      API_BASE_URL: http://resource-api:8082
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET:?required}
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      keycloak:
        condition: service_healthy
      resource-api:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  service-client:
    profiles: [tools]
    build:
      context: .
      args:
        MODULE: service-client
    environment:
      TOKEN_URI: http://keycloak:8080/realms/auth-lab/protocol/openid-connect/token
      API_BASE_URL: http://resource-api:8082
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET:?required}
    depends_on:
      keycloak:
        condition: service_healthy
      resource-api:
        condition: service_healthy

volumes:
  postgres-data:
